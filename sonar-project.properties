# SonarQube-Konfiguration Hollywood Manager
# Scan starten: tools\sonar-analyze.ps1 (Server muss laufen: tools\sonar-server.ps1)
sonar.projectKey=hollywood-manager
sonar.projectName=Hollywood Manager
sonar.host.url=http://localhost:9000

# Analysierte Quellen (GDScript wird von SonarQube nicht unterstuetzt -> gdlint, siehe prompts/tasks/06)
sonar.sources=js,tools,index.html

# Generierte/fremde Dateien ausschliessen
sonar.exclusions=js/actors_full.js

sonar.sourceEncoding=UTF-8
