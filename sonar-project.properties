# SonarQube-Konfiguration Hollywood Manager
# Scan starten: tools\sonar-analyze.ps1 (Server muss laufen: tools\sonar-server.ps1)
sonar.projectKey=hollywood-manager
sonar.projectName=Hollywood Manager
sonar.host.url=http://localhost:9000

# WICHTIG: Die Webversion (index.html, js/) ist EINGEFROREN und wird bewusst
# NICHT analysiert. Die Godot-Version ist die einzige aktiv entwickelte Version.
# GDScript wird von SonarQube nicht unterstuetzt -> gdlint (prompts/tasks/06).
# Analysiert wird nur noch der Python-Tooling-Code.
sonar.sources=tools

# Webversion und Fremd-/Generiertes explizit ausschliessen
sonar.exclusions=js/**,index.html,tools/__pycache__/**

# Python-Version fuer praezisere Analyse (Warnung im Dashboard behoben)
sonar.python.version=3.14

sonar.sourceEncoding=UTF-8
